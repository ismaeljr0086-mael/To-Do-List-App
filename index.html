<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>My Activities</h1>
      <p class="subtitle">Stay focused bro. Get it done.</p>
    </header>

    <div class="input-row">
      <input type="text" id="task-input" placeholder="Add a new task…" autocomplete="off" />
      <button id="add-btn" aria-label="Add task">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div id="empty-warning" class="warning hidden">Please enter a task first.</div>

    <ul id="task-list"></ul>

    <footer id="task-footer" class="hidden">
      <span id="task-count"></span>
      <button id="clear-completed">Clear completed</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
